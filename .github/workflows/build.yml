name: Build Unsigned IPA

on:
  push:
    branches: [raw]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Get prebuilt frameworks and resources
        run: |
          ./get_frameworks.sh
          ./get_resources.sh
          rm -rf Blink.xcodeproj/project.xcworkspace/xcshareddata/

      - name: Set up config
        run: cp template_setup.xcconfig developer_setup.xcconfig

      - name: Build (no signing)
        run: |
          xcodebuild build \
            -project Blink.xcodeproj \
            -scheme Blink \
            -destination "generic/platform=iOS" \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CONFIGURATION_BUILD_DIR=$RUNNER_TEMP/build

      - name: Package into IPA
        run: |
          mkdir -p $RUNNER_TEMP/Payload
          cp -r $RUNNER_TEMP/build/Blink.app $RUNNER_TEMP/Payload/
          cd $RUNNER_TEMP
          zip -r Blink-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Blink-unsigned-IPA
          path: $RUNNER_TEMP/Blink-unsigned.ipa
          retention-days: 7
